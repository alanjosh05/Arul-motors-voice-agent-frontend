<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 96 320 352" role="img" aria-label="Arul Motors Yamaha, Nazareth">
  <!-- Full logo without background, for dark/coloured panels (login): AM with
       ARUL and MOTORS, then NAZARETH and YAMAHA, after the client's badge. -->
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f43f4a"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g stroke="#ffffff" stroke-width="6" stroke-linejoin="round" fill="url(#red)">
    <path fill-rule="evenodd" d="M110 300 L178 112 L226 112 L290 300 L252 300 L240 264 L160 264 L148 300 Z M172 230 L230 230 L201 152 Z"/>
    <path d="M250 300 V112 H292 L322 192 L352 112 H384 V300 H348 V188 L322 252 L296 188 V300 Z"/>
  </g>
  <g fill="#ffffff" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-weight="800" text-anchor="middle">
    <!-- ARUL under the A's crossbar, MOTORS down the M's right stem -->
    <text x="200" y="294" font-size="25" letter-spacing="1">ARUL</text>
    <g font-size="23">
      <text x="366" y="146">M</text>
      <text x="366" y="173">O</text>
      <text x="366" y="200">T</text>
      <text x="366" y="227">O</text>
      <text x="366" y="254">R</text>
      <text x="366" y="281">S</text>
    </g>
  </g>
  <rect x="106" y="318" width="300" height="2.5" fill="url(#rule)"/>
  <text x="256" y="356" fill="#ffffff" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="13" text-anchor="middle">NAZARETH</text>
  <rect x="106" y="370" width="300" height="2.5" fill="url(#rule)"/>
  <text x="256" y="430" fill="url(#red)" stroke="#ffffff" stroke-width="2.5" paint-order="stroke" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="60" letter-spacing="2" text-anchor="middle">YAMAHA</text>
</svg>
