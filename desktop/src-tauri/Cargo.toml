[package]
name = "arul-motors-erp"
version = "1.0.0"
description = "Arul Motors ERP desktop app"
authors = ["Arul Motors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "arul_motors_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
